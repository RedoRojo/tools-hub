<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      var savedScheme = localStorage.getItem("color-scheme");
      if (savedScheme === "light" || savedScheme === "dark") {
        document.querySelector('meta[name="color-scheme"]').content = savedScheme;
      }
    } catch (e) {}
  </script>
  <title>Tools Hub | Local Tool Manager</title>
  <style>
    :root {
      color-scheme: light dark;

      /* Light tokens */
      --bg-light: #f8fafc;
      --card-bg-light: #ffffff;
      --card-hover-light: #f1f5f9;
      --border-light: #cbd5e1;
      --border-hover-light: #94a3b8;
      --text-main-light: #0f172a;
      --text-muted-light: #475569;
      --text-dim-light: #475569;
      --accent-light: #2563eb;
      --accent-hover-light: #1d4ed8;
      --accent-bg-light: #eff6ff;
      --success-light: #047857;
      --success-bg-light: #ecfdf5;
      --success-border-light: rgba(4, 120, 87, 0.35);
      --danger-light: #b91c1c;
      --danger-bg-light: #fef2f2;
      --danger-border-light: rgba(185, 28, 28, 0.35);
      --badge-bg-light: #f1f5f9;
      --shadow-card-light: 0 4px 16px rgba(15, 23, 42, 0.06);

      /* Dark tokens */
      --bg-dark: #090a0b;
      --card-bg-dark: #121316;
      --card-hover-dark: #18191d;
      --border-dark: #2c3038;
      --border-hover-dark: #454a56;
      --text-main-dark: #f3f4f6;
      --text-muted-dark: #b4bcc8;
      --text-dim-dark: #9ca3af;
      --accent-dark: #3b82f6;
      --accent-hover-dark: #2563eb;
      --accent-bg-dark: rgba(59, 130, 246, 0.14);
      --success-dark: #10b981;
      --success-bg-dark: rgba(16, 185, 129, 0.14);
      --success-border-dark: rgba(16, 185, 129, 0.4);
      --danger-dark: #f87171;
      --danger-bg-dark: rgba(239, 68, 68, 0.14);
      --danger-border-dark: rgba(239, 68, 68, 0.4);
      --badge-bg-dark: #1e2025;
      --shadow-card-dark: 0 4px 20px rgba(0, 0, 0, 0.3);

      /* Active semantic tokens (light default fallback) */
      --bg: var(--bg-light);
      --card-bg: var(--card-bg-light);
      --card-hover: var(--card-hover-light);
      --border: var(--border-light);
      --border-hover: var(--border-hover-light);
      --text-main: var(--text-main-light);
      --text-muted: var(--text-muted-light);
      --text-dim: var(--text-dim-light);
      --accent: var(--accent-light);
      --accent-hover: var(--accent-hover-light);
      --accent-bg: var(--accent-bg-light);
      --success: var(--success-light);
      --success-bg: var(--success-bg-light);
      --success-border: var(--success-border-light);
      --danger: var(--danger-light);
      --danger-bg: var(--danger-bg-light);
      --danger-border: var(--danger-border-light);
      --badge-bg: var(--badge-bg-light);
      --shadow-card: var(--shadow-card-light);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;

      accent-color: var(--accent);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--bg-dark);
        --card-bg: var(--card-bg-dark);
        --card-hover: var(--card-hover-dark);
        --border: var(--border-dark);
        --border-hover: var(--border-hover-dark);
        --text-main: var(--text-main-dark);
        --text-muted: var(--text-muted-dark);
        --text-dim: var(--text-dim-dark);
        --accent: var(--accent-dark);
        --accent-hover: var(--accent-hover-dark);
        --accent-bg: var(--accent-bg-dark);
        --success: var(--success-dark);
        --success-bg: var(--success-bg-dark);
        --success-border: var(--success-border-dark);
        --danger: var(--danger-dark);
        --danger-bg: var(--danger-bg-dark);
        --danger-border: var(--danger-border-dark);
        --badge-bg: var(--badge-bg-dark);
        --shadow-card: var(--shadow-card-dark);
      }
    }

    :root:has(> head > meta[name="color-scheme"][content="dark"]) {
      color-scheme: dark;
      --bg: var(--bg-dark);
      --card-bg: var(--card-bg-dark);
      --card-hover: var(--card-hover-dark);
      --border: var(--border-dark);
      --border-hover: var(--border-hover-dark);
      --text-main: var(--text-main-dark);
      --text-muted: var(--text-muted-dark);
      --text-dim: var(--text-dim-dark);
      --accent: var(--accent-dark);
      --accent-hover: var(--accent-hover-dark);
      --accent-bg: var(--accent-bg-dark);
      --success: var(--success-dark);
      --success-bg: var(--success-bg-dark);
      --success-border: var(--success-border-dark);
      --danger: var(--danger-dark);
      --danger-bg: var(--danger-bg-dark);
      --danger-border: var(--danger-border-dark);
      --badge-bg: var(--badge-bg-dark);
      --shadow-card: var(--shadow-card-dark);
    }

    :root:has(> head > meta[name="color-scheme"][content="light"]) {
      color-scheme: light;
      --bg: var(--bg-light);
      --card-bg: var(--card-bg-light);
      --card-hover: var(--card-hover-light);
      --border: var(--border-light);
      --border-hover: var(--border-hover-light);
      --text-main: var(--text-main-light);
      --text-muted: var(--text-muted-light);
      --text-dim: var(--text-dim-light);
      --accent: var(--accent-light);
      --accent-hover: var(--accent-hover-light);
      --accent-bg: var(--accent-bg-light);
      --success: var(--success-light);
      --success-bg: var(--success-bg-light);
      --success-border: var(--success-border-light);
      --danger: var(--danger-light);
      --danger-bg: var(--danger-bg-light);
      --danger-border: var(--danger-border-light);
      --badge-bg: var(--badge-bg-light);
      --shadow-card: var(--shadow-card-light);
    }

    @supports (color: light-dark(white, black)) {
      :root {
        --bg: light-dark(var(--bg-light), var(--bg-dark));
        --card-bg: light-dark(var(--card-bg-light), var(--card-bg-dark));
        --card-hover: light-dark(var(--card-hover-light), var(--card-hover-dark));
        --border: light-dark(var(--border-light), var(--border-dark));
        --border-hover: light-dark(var(--border-hover-light), var(--border-hover-dark));
        --text-main: light-dark(var(--text-main-light), var(--text-main-dark));
        --text-muted: light-dark(var(--text-muted-light), var(--text-muted-dark));
        --text-dim: light-dark(var(--text-dim-light), var(--text-dim-dark));
        --accent: light-dark(var(--accent-light), var(--accent-dark));
        --accent-hover: light-dark(var(--accent-hover-light), var(--accent-hover-dark));
        --accent-bg: light-dark(var(--accent-bg-light), var(--accent-bg-dark));
        --success: light-dark(var(--success-light), var(--success-dark));
        --success-bg: light-dark(var(--success-bg-light), var(--success-bg-dark));
        --success-border: light-dark(var(--success-border-light), var(--success-border-dark));
        --danger: light-dark(var(--danger-light), var(--danger-dark));
        --danger-bg: light-dark(var(--danger-bg-light), var(--danger-bg-dark));
        --danger-border: light-dark(var(--danger-border-light), var(--danger-border-dark));
        --badge-bg: light-dark(var(--badge-bg-light), var(--badge-bg-dark));
        --shadow-card: light-dark(var(--shadow-card-light), var(--shadow-card-dark));
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .visually-hidden:where(:not(:focus-within, :active)) {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      white-space: nowrap !important;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    :where(a:any-link, button):focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      flex-wrap: wrap;
    }

    .status-summary {
      font-size: 0.8125rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--badge-bg);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
    }

    .summary-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .summary-dot.active {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.65rem;
      min-block-size: 36px;
      min-inline-size: 36px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      font-size: 0.8125rem;
      font-weight: 500;
      font-family: inherit;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--card-hover);
      color: var(--text-main);
      border-color: var(--border-hover);
    }

    /* Theme toggle icon branching driven by meta[name="color-scheme"] + OS fallback */
    .theme-state-dark {
      display: none;
    }

    .theme-state-light {
      display: inline-flex;
      align-items: center;
    }

    @media (prefers-color-scheme: dark) {
      .theme-state-light {
        display: none;
      }
      .theme-state-dark {
        display: inline-flex;
        align-items: center;
      }
    }

    :root:has(> head > meta[name="color-scheme"][content="dark"]) .theme-state-light {
      display: none;
    }
    :root:has(> head > meta[name="color-scheme"][content="dark"]) .theme-state-dark {
      display: inline-flex;
      align-items: center;
    }

    :root:has(> head > meta[name="color-scheme"][content="light"]) .theme-state-light {
      display: inline-flex;
      align-items: center;
    }
    :root:has(> head > meta[name="color-scheme"][content="light"]) .theme-state-dark {
      display: none;
    }

    main {
      flex: 1;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    .hero {
      margin-bottom: 2rem;
    }

    .hero h1 {
      font-size: 1.625rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 0.9375rem;
    }

    /* Grid layout */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .tool-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: var(--shadow-card);
      position: relative;
    }

    .tool-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .tool-card.is-running {
      border-color: var(--success-border);
    }

    .tool-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .tool-info {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .tool-icon-wrapper {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--badge-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-main);
    }

    .tool-card.is-running .tool-icon-wrapper {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    .tool-titles h2 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .tool-titles .category {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
      margin-top: 0.15rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: var(--badge-bg);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .status-badge.active {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .status-badge.active .pulse-dot {
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .tool-desc {
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.45;
      margin-bottom: 1.25rem;
      flex: 1;
    }

    .tool-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.75rem;
      margin-bottom: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .actions-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Primary action button */
    .btn-launch {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-block-size: 38px;
      padding: 0.6rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      border: 1px solid transparent;
    }

    .btn-launch.start {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-launch.start:hover {
      background: var(--accent-hover);
    }

    .btn-launch.open {
      background: var(--badge-bg);
      color: var(--text-main);
      border-color: var(--border-hover);
    }

    .btn-launch.open:hover {
      background: var(--card-hover);
      border-color: var(--text-dim);
    }

    .btn-action-small {
      min-inline-size: 38px;
      min-block-size: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--badge-bg);
      color: var(--text-muted);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .btn-action-small:hover {
      background: var(--card-hover);
      color: var(--text-main);
      border-color: var(--border-hover);
    }

    .btn-action-small.stop:hover {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: var(--danger-border);
    }

    .btn-action-small[disabled] {
      opacity: 0.55;
      cursor: wait;
    }

    /* Toast region */
    .toast-region {
      position: fixed;
      bottom: 1.75rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      pointer-events: none;
    }

    .toast {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-hover);
      padding: 0.65rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
    }

    .toast.is-error .toast-dot {
      background: var(--danger);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem;
      background: var(--bg);
      font-size: 0.8125rem;
      color: var(--text-dim);
      text-align: center;
    }

    .tip-box {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .code-tag {
      background: var(--badge-bg);
      border: 1px solid var(--border);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text-muted);
    }

    @media (pointer: coarse) {
      .icon-btn,
      .btn-launch,
      .btn-action-small {
        min-block-size: 44px;
      }
      .btn-action-small {
        min-inline-size: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
      .tool-card:hover {
        transform: none;
      }
    }

    @media (forced-colors: active) {
      .tool-card,
      .status-badge,
      .icon-btn,
      .btn-launch,
      .btn-action-small,
      .toast {
        border: 1px solid ButtonText;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">⚡</div>
        <div class="brand-title">Tools Hub</div>
      </div>
      <div class="header-actions">
        <div class="status-summary" id="statusSummary">
          <div class="summary-dot" id="summaryDot" aria-hidden="true"></div>
          <span id="summaryText">Loading tools...</span>
        </div>
        <button type="button" class="icon-btn" id="btnRefresh" title="Refresh status (R)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <span>Refresh</span>
        </button>
        <button type="button" class="icon-btn" id="btnThemeToggle" title="Toggle light/dark theme">
          <span class="theme-state-light">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span class="visually-hidden">Switch to dark theme</span>
          </span>
          <span class="theme-state-dark">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span class="visually-hidden">Switch to light theme</span>
          </span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Tools Dashboard</h1>
      <p>Centralized launcher: click any tool to start it and open it in a new tab.</p>
    </section>

    <div class="tools-grid" id="toolsGrid">
      <!-- Tool cards rendered dynamically -->
    </div>
  </main>

  <div class="toast-region" role="region" aria-label="Notifications">
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <span class="toast-dot" aria-hidden="true"></span>
      <span id="toastMessage"></span>
    </div>
  </div>

  <footer>
    <div class="tip-box">
      <span><span aria-hidden="true">💡</span> Each tool runs in its own subdirectory and port without conflicts.</span>
      <span>Add a new folder with <code class="code-tag">run.sh</code> to auto-discover it.</span>
    </div>
  </footer>

  <script>
    let toolsData = [];
    let isFetching = false;
    let lastStructureKey = '';
    let toastTimeout = null;
    const STORAGE_KEY_SCHEME = 'color-scheme';

    const btnRefresh = document.getElementById('btnRefresh');
    const btnThemeToggle = document.getElementById('btnThemeToggle');
    const colorSchemeMeta = document.querySelector('meta[name="color-scheme"]');
    const toolsGrid = document.getElementById('toolsGrid');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');

    const ICONS = {
      pdf: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>`,
      transcript: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>`,
      qr: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><line x1="7" y1="7" x2="7.01" y2="7"></line><line x1="17" y1="7" x2="17.01" y2="7"></line><line x1="7" y1="17" x2="7.01" y2="17"></line><line x1="17" y1="17" x2="17.01" y2="17"></line></svg>`,
      'book-open': `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>`,
      code: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>`
    };

    // --- Theme Management ---
    function getSystemScheme() {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function applyScheme(scheme) {
      if (colorSchemeMeta) {
        colorSchemeMeta.content = scheme === 'light' || scheme === 'dark' ? scheme : 'light dark';
      }
    }

    btnThemeToggle.addEventListener('click', () => {
      let currentStored = null;
      try {
        currentStored = localStorage.getItem(STORAGE_KEY_SCHEME);
      } catch (e) {}

      const systemScheme = getSystemScheme();
      const renderedScheme = currentStored === 'light' || currentStored === 'dark' ? currentStored : systemScheme;
      const targetScheme = renderedScheme === 'dark' ? 'light' : 'dark';

      try {
        if (targetScheme === systemScheme) {
          localStorage.removeItem(STORAGE_KEY_SCHEME);
          applyScheme('light dark');
        } else {
          localStorage.setItem(STORAGE_KEY_SCHEME, targetScheme);
          applyScheme(targetScheme);
        }
      } catch (e) {
        applyScheme(targetScheme === systemScheme ? 'light dark' : targetScheme);
      }
    });

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY_SCHEME) {
        applyScheme(e.newValue === 'light' || e.newValue === 'dark' ? e.newValue : 'light dark');
      }
    });

    function showToast(msg, isError = false) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toast.classList.toggle('is-error', isError);
      toastMessage.textContent = '';
      toast.classList.add('show');
      requestAnimationFrame(() => {
        toastMessage.textContent = msg;
      });
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
          if (!toast.classList.contains('show')) {
            toastMessage.textContent = '';
          }
        }, 250);
      }, 2600);
    }

    async function fetchTools() {
      if (isFetching) return;
      isFetching = true;
      try {
        const res = await fetch('/api/tools');
        if (!res.ok) throw new Error('Network error');
        toolsData = await res.json();
        renderTools();
      } catch (err) {
        console.error('Failed to fetch tools:', err);
      } finally {
        isFetching = false;
      }
    }

    function updateHeaderSummary() {
      const activeCount = toolsData.filter((t) => t.port_active).length;
      const summaryDot = document.getElementById('summaryDot');
      const summaryText = document.getElementById('summaryText');
      if (activeCount > 0) {
        summaryDot.classList.add('active');
        summaryText.textContent = `${activeCount} of ${toolsData.length} active`;
      } else {
        summaryDot.classList.remove('active');
        summaryText.textContent = `0 of ${toolsData.length} active`;
      }
    }

    function getStructureKey(list) {
      return JSON.stringify(
        list.map((t) => [t.id, t.name, t.description, t.category, t.icon, t.port, t.dir, Boolean(t.port_active)])
      );
    }

    function renderTools() {
      updateHeaderSummary();

      const nextStructureKey = getStructureKey(toolsData);
      if (nextStructureKey === lastStructureKey) {
        // Update uptime text in-place so active keyboard focus is never disrupted
        for (const tool of toolsData) {
          const metaEl = document.getElementById(`meta-status-${tool.id}`);
          if (metaEl) {
            metaEl.textContent = tool.port_active && tool.uptime ? `Up ${formatUptime(tool.uptime)}` : tool.dir;
          }
        }
        return;
      }

      // Preserve focus across structural re-renders if user focused inside a card
      const activeEl = document.activeElement;
      const focusedToolId = activeEl && activeEl.dataset ? activeEl.dataset.toolId : null;
      const focusedAction = activeEl && activeEl.dataset ? activeEl.dataset.action : null;

      lastStructureKey = nextStructureKey;

      toolsGrid.innerHTML = toolsData.map((tool) => {
        const isRunning = Boolean(tool.port_active);
        const iconSvg = ICONS[tool.icon] || ICONS.code;
        const statusLabel = isRunning ? 'Running' : 'Stopped';
        const portDisplay = `127.0.0.1:${tool.port}`;
        const safeName = escapeHtml(tool.name);
        const safeId = escapeHtml(tool.id);

        return `
          <article class="tool-card ${isRunning ? 'is-running' : ''}" id="card-${safeId}">
            <div>
              <div class="tool-header">
                <div class="tool-info">
                  <div class="tool-icon-wrapper">
                    ${iconSvg}
                  </div>
                  <div class="tool-titles">
                    <h2>${safeName}</h2>
                    <div class="category">${escapeHtml(tool.category || 'Tool')}</div>
                  </div>
                </div>
                <div class="status-badge ${isRunning ? 'active' : ''}">
                  <span class="pulse-dot" aria-hidden="true"></span>
                  <span>${statusLabel}</span>
                </div>
              </div>

              <p class="tool-desc">${escapeHtml(tool.description)}</p>
            </div>

            <div>
              <div class="tool-meta">
                <span>Port: ${portDisplay}</span>
                <span id="meta-status-${safeId}">${isRunning && tool.uptime ? 'Up ' + formatUptime(tool.uptime) : escapeHtml(tool.dir)}</span>
              </div>

              <div class="actions-row">
                <a href="/launch/${encodeURIComponent(tool.id)}" target="_blank" rel="noopener noreferrer" class="btn-launch ${isRunning ? 'open' : 'start'}" data-tool-id="${safeId}" data-action="launch">
                  ${isRunning ? `
                    <span>Open in new tab</span>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                      <polyline points="15 3 21 3 21 9"></polyline>
                      <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                  ` : `
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <span>Launch &amp; Open</span>
                  `}
                </a>

                ${isRunning ? `
                  <button type="button" class="btn-action-small" data-action="restart" data-tool-id="${safeId}" aria-label="Restart ${safeName}" title="Restart server">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <polyline points="23 4 23 10 17 10"></polyline>
                      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                  </button>
                  <button type="button" class="btn-action-small stop" data-action="stop" data-tool-id="${safeId}" aria-label="Stop ${safeName}" title="Stop server">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    </svg>
                  </button>
                ` : ''}
              </div>
            </div>
          </article>
        `;
      }).join('');

      if (focusedToolId) {
        const nextFocus =
          toolsGrid.querySelector(`[data-tool-id="${CSS.escape(focusedToolId)}"][data-action="${CSS.escape(focusedAction || 'launch')}"]`) ||
          toolsGrid.querySelector(`[data-tool-id="${CSS.escape(focusedToolId)}"][data-action="launch"]`);
        if (nextFocus) {
          nextFocus.focus();
        }
      }
    }

    async function stopTool(id, triggerBtn) {
      if (triggerBtn) triggerBtn.disabled = true;
      try {
        const res = await fetch(`/api/tools/${encodeURIComponent(id)}/stop`, { method: 'POST' });
        if (!res.ok) throw new Error('Request failed');
        await res.json();
        showToast(`Stopped ${id}`);
        setTimeout(fetchTools, 400);
      } catch (err) {
        if (triggerBtn) triggerBtn.disabled = false;
        showToast('Failed to stop tool', true);
      }
    }

    async function restartTool(id, triggerBtn) {
      if (triggerBtn) triggerBtn.disabled = true;
      try {
        const res = await fetch(`/api/tools/${encodeURIComponent(id)}/restart`, { method: 'POST' });
        if (!res.ok) throw new Error('Request failed');
        await res.json();
        showToast(`Restarting ${id}...`);
        setTimeout(fetchTools, 700);
      } catch (err) {
        if (triggerBtn) triggerBtn.disabled = false;
        showToast('Failed to restart tool', true);
      }
    }

    toolsGrid.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action][data-tool-id]');
      if (!btn) return;
      const { action, toolId } = btn.dataset;
      if (action === 'stop') {
        stopTool(toolId, btn);
      } else if (action === 'restart') {
        restartTool(toolId, btn);
      }
    });

    btnRefresh.addEventListener('click', () => {
      fetchTools();
    });

    function formatUptime(seconds) {
      if (seconds < 60) return `${seconds}s`;
      const mins = Math.floor(seconds / 60);
      if (mins < 60) return `${mins}m`;
      const hours = Math.floor(mins / 60);
      return `${hours}h ${mins % 60}m`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Keyboard shortcut 'R' to refresh tool statuses
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey && !e.altKey) {
        if (document.activeElement && document.activeElement.tagName !== 'INPUT') {
          fetchTools();
        }
      }
    });

    // Initial load and 2.5s status polling
    fetchTools();
    setInterval(fetchTools, 2500);
  </script>
</body>
</html>
